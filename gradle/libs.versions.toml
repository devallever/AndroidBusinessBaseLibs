[versions]
# android sdk versions
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

# android & kotlin & google
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.8.3"
activityCompose = "1.11.0"
composeBom = "2024.09.00"
appcompat = "1.7.1"
material = "1.13.0"
coil = "2.1.0"
activityKtx = "1.7.2"
fragmentKtx = "1.5.6"
recyclerview = "1.3.0"
viewpager2 = "1.0.0"
lifecycleViewModelKtx = "2.5.1"
lifecycleExtensions = "2.2.0"
lifecycleLivedataKtx = "2.5.1"
coroutinesCore = "1.6.4"
coroutinesAndroid = "1.6.4"
datastoreCore = "1.0.0"
datastore = "1.0.0"
datastorePreferences = "1.0.0"
exifinterface = "1.3.3"
pagingRuntimeKtx = "3.1.1"
constraintlayout = "2.2.1"
gson = "2.10"

# third party
arouter = "1.5.2"
okhttp = "4.9.3"
